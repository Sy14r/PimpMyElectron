  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    &quot;codex-visualization-widget-state&quot;,

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

    const nextState = typeof next === &quot;function&quot; ? next(state) : next;

      typeof nextState !== &quot;object&quot; ||

      const timeout = globalThis.setTimeout(() =&gt; {

        reject(persistenceError());

      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,

    };
    globalThis.dispatchEvent(

        detail: { globals: globalThis.openai },
      }),

  };

    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */

                return;
              }

                pendingStateWrites.delete(id);

        return;
      }
      hostPort = nextHostPort;

  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {

    }

    if (event.target instanceof globalThis.Element) {

    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {

        id = decodeURIComponent(href.slice(1));
      } catch {

      }

  &lt;script&gt;
  (()=&gt;{
    const root=document.getElementById(&#x27;spotify-concepts&#x27;),panel=root.querySelector(&#x27;.window&#x27;),drawer=root.querySelector(&#x27;.drawer&#x27;),content=root.querySelector(&#x27;#sp-drawer&#x27;),player=root.querySelector(&#x27;#sp-player&#x27;),nav=root.querySelector(&#x27;.docknav&#x27;);
    const icon=name=&gt;`&lt;i data-lucide=&quot;${name}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;
    const tracks=[{name:&#x27;New Dawn&#x27;,artist:&#x27;Mira Lane&#x27;,album:&#x27;Soft Focus&#x27;,cover:0,length:232},{name:&#x27;Sunroom&#x27;,artist:&#x27;Low Season&#x27;,album:&#x27;Slow Hours&#x27;,cover:1,length:198},{name:&#x27;Night Drive&#x27;,artist:&#x27;Parallel Lines&#x27;,album:&#x27;After Dark&#x27;,cover:2,length:267},{name:&#x27;Floating&#x27;,artist:&#x27;Mira Lane&#x27;,album:&#x27;Soft Focus&#x27;,cover:0,length:216},{name:&#x27;Small Hours&#x27;,artist:&#x27;Pale North&#x27;,album:&#x27;Still Life&#x27;,cover:3,length:184},{name:&#x27;Tidal&#x27;,artist:&#x27;Parallel Lines&#x27;,album:&#x27;After Dark&#x27;,cover:2,length:241}];
    const collections=[{name:&#x27;Deep work&#x27;,detail:&#x27;Playlist · Made by you&#x27;,cover:0,ids:[0,3,4]},{name:&#x27;Evening reset&#x27;,detail:&#x27;Playlist · Made by you&#x27;,cover:2,ids:[2,5,1]},{name:&#x27;Soft Focus&#x27;,detail:&#x27;Album · Mira Lane&#x27;,cover:0,ids:[0,3]},{name:&#x27;Slow Hours&#x27;,detail:&#x27;Album · Low Season&#x27;,cover:1,ids:[1,4]}];
    const state={concept:&#x27;switcher&#x27;,view:&#x27;&#x27;,current:0,playing:true,position:81,volume:65,pinned:false,open:true,query:&#x27;&#x27;,scope:&#x27;All&#x27;,collection:null,queue:[1,2,4],pins:[0,2],saved:[0,3,4],shuffle:false,repeat:false};

    function restore(saved){const s=saved?.privateContent;if(!s)return;for(const k of [&#x27;concept&#x27;,&#x27;view&#x27;,&#x27;scope&#x27;])if(typeof s[k]===&#x27;string&#x27;)state[k]=s[k];for(const k of [&#x27;returnAfterPlay&#x27;,&#x27;artwork&#x27;])if(typeof s[k]===&#x27;boolean&#x27;)design[k]=s[k];if([&#x27;controls&#x27;,&#x27;switcher&#x27;,&#x27;library&#x27;].includes(state.concept)===false)state.concept=&#x27;switcher&#x27;;if(![&#x27;&#x27;,&#x27;search&#x27;,&#x27;library&#x27;,&#x27;pins&#x27;,&#x27;queue&#x27;].includes(state.view))state.view=&#x27;&#x27;;}

    function renderPlayer(){const t=tracks[state.current];player.innerHTML=`&lt;div class=&quot;track&quot;&gt;${design.artwork?art(t.cover):&#x27;&#x27;}&lt;div class=&quot;tracktext&quot;&gt;&lt;div class=&quot;title&quot;&gt;${t.name}&lt;/div&gt;&lt;div class=&quot;muted&quot;&gt;${t.artist}&lt;/div&gt;&lt;div class=&quot;album&quot;&gt;${t.album}&lt;/div&gt;&lt;/div&gt;&lt;button data-action=&quot;favorite&quot; aria-label=&quot;${state.concept===&#x27;controls&#x27;?&#x27;Pin track in PME&#x27;:&#x27;Save track to library&#x27;}&quot; aria-pressed=&quot;${(state.concept===&#x27;controls&#x27;?state.pins:state.saved).includes(state.current)}&quot;&gt;${icon(state.concept===&#x27;controls&#x27;?&#x27;pin&#x27;:&#x27;heart&#x27;)}&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;transport&quot;&gt;&lt;input id=&quot;sp-seek&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;${t.length}&quot; value=&quot;${state.position}&quot; aria-label=&quot;Track position&quot;&gt;&lt;div class=&quot;time&quot;&gt;&lt;span id=&quot;sp-elapsed&quot;&gt;${time(state.position)}&lt;/span&gt;&lt;span&gt;${time(t.length)}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;controls&quot;&gt;&lt;button data-action=&quot;shuffle&quot; aria-label=&quot;Shuffle&quot; aria-pressed=&quot;${state.shuffle}&quot;&gt;${icon(&#x27;shuffle&#x27;)}&lt;/button&gt;&lt;button data-action=&quot;previous&quot; aria-label=&quot;Previous track&quot;&gt;${icon(&#x27;skip-back&#x27;)}&lt;/button&gt;&lt;button class=&quot;play&quot; data-action=&quot;playpause&quot; aria-label=&quot;${state.playing?&#x27;Pause&#x27;:&#x27;Play&#x27;}&quot;&gt;${icon(state.playing?&#x27;pause&#x27;:&#x27;play&#x27;)}&lt;/button&gt;&lt;button data-action=&quot;next&quot; aria-label=&quot;Next track&quot;&gt;${icon(&#x27;skip-forward&#x27;)}&lt;/button&gt;&lt;button data-action=&quot;repeat&quot; aria-label=&quot;Repeat&quot; aria-pressed=&quot;${state.repeat}&quot;&gt;${icon(&#x27;repeat&#x27;)}&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;volume&quot;&gt;${icon(&#x27;volume-2&#x27;)}&lt;input id=&quot;sp-volume&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;${state.volume}&quot; aria-label=&quot;Spotify volume&quot;&gt;&lt;output&gt;${state.volume}%&lt;/output&gt;&lt;span class=&quot;muted&quot;&gt;Spotify&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;`;}
    function row(id,mode=&#x27;song&#x27;){const t=tracks[id];return `&lt;div class=&quot;row&quot;&gt;&lt;button class=&quot;song&quot; data-play=&quot;${id}&quot; aria-label=&quot;Play ${t.name}&quot;&gt;${art(t.cover)}&lt;span class=&quot;names&quot;&gt;&lt;strong&gt;${t.name}&lt;/strong&gt;&lt;small&gt;${t.artist}&lt;/small&gt;&lt;/span&gt;&lt;/button&gt;${mode===&#x27;queue&#x27;?`&lt;button class=&quot;add&quot; data-remove=&quot;${id}&quot; aria-label=&quot;Remove ${t.name} from queue&quot;&gt;${icon(&#x27;x&#x27;)}&lt;/button&gt;`:state.concept===&#x27;controls&#x27;?`&lt;button class=&quot;add&quot; data-track-pin=&quot;${id}&quot; aria-label=&quot;Pin ${t.name}&quot; aria-pressed=&quot;${state.pins.includes(id)}&quot;&gt;${icon(&#x27;pin&#x27;)}&lt;/button&gt;`:`&lt;button class=&quot;add&quot; data-add=&quot;${id}&quot; aria-label=&quot;Add ${t.name} to queue&quot;&gt;${icon(&#x27;list-plus&#x27;)}&lt;/button&gt;`}&lt;/div&gt;`;}
    function collectionRows(items){return items.map((c)=&gt;`&lt;div class=&quot;row&quot;&gt;&lt;button class=&quot;song&quot; data-collection=&quot;${collections.indexOf(c)}&quot;&gt;${art(c.cover)}&lt;span class=&quot;names&quot;&gt;&lt;strong&gt;${c.name}&lt;/strong&gt;&lt;small&gt;${c.detail}&lt;/small&gt;&lt;/span&gt;${icon(&#x27;chevron-right&#x27;)}&lt;/button&gt;&lt;/div&gt;`).join(&#x27;&#x27;);}
    function renderResults(){const dest=content.querySelector(&#x27;#sp-results&#x27;);if(!dest)return;const q=state.query.toLowerCase().trim();if(state.view===&#x27;search&#x27;){
      const ids=(state.concept===&#x27;controls&#x27;?[...new Set([...state.pins,0,1,2])]:tracks.map((_,i)=&gt;i)).filter(i=&gt;(tracks[i].name+&#x27; &#x27;+tracks[i].artist+&#x27; &#x27;+tracks[i].album).toLowerCase().includes(q));

    }else if(state.view===&#x27;library&#x27;){

    function render(){root.style.setProperty(&#x27;--sp-width&#x27;,design.width+&#x27;px&#x27;);root.style.setProperty(&#x27;--sp-radius&#x27;,design.radius+&#x27;px&#x27;);panel.hidden=!state.open;panel.classList.toggle(&#x27;mini&#x27;,state.concept===&#x27;library&#x27;&amp;&amp;!!state.view);root.querySelectorAll(&#x27;[data-concept]&#x27;).forEach(b=&gt;b.setAttribute(&#x27;aria-pressed&#x27;,b.dataset.concept===state.concept));const views=state.concept===&#x27;controls&#x27;?[[&#x27;pins&#x27;,&#x27;pin&#x27;,&#x27;Pins&#x27;],[&#x27;search&#x27;,&#x27;search&#x27;,&#x27;Find&#x27;]]:[[&#x27;search&#x27;,&#x27;search&#x27;,&#x27;Search&#x27;],[&#x27;library&#x27;,&#x27;library&#x27;,&#x27;Library&#x27;],[&#x27;queue&#x27;,&#x27;list-music&#x27;,&#x27;Queue&#x27;]];nav.innerHTML=views.map(([v,i,label])=&gt;`&lt;button data-view=&quot;${v}&quot; aria-pressed=&quot;${state.view===v}&quot;&gt;${icon(i)} ${label}&lt;/button&gt;`).join(&#x27;&#x27;);renderPlayer();renderDrawer();behavior();icons();}
    function play(id){state.current=id;state.playing=true;state.position=0;if(design.returnAfterPlay&amp;&amp;state.concept!==&#x27;library&#x27;){state.view=&#x27;&#x27;;state.query=&#x27;&#x27;;}render();toast(&#x27;Playing &#x27;+tracks[id].name);save();}
